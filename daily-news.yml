name: Generate Daily Watch News

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC daily
  workflow_dispatch:       # Manual trigger anytime from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-news.js

      - name: Commit news.json
        run: |
          git config user.name "StoriestoWatch Bot"
          git config user.email "bot@storiestowatch.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Daily news update: $(date -u '+%Y-%m-%d')"
          git push
