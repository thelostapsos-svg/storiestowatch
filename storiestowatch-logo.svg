<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F0F0D"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Outer border -->
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <rect x="18" y="18" width="364" height="364" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner ornaments -->
  <g fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.7" filter="url(#subtleGlow)">
    <!-- Top left -->
    <path d="M 12 42 L 12 12 L 42 12"/>
    <!-- Top right -->
    <path d="M 358 12 L 388 12 L 388 42"/>
    <!-- Bottom left -->
    <path d="M 12 358 L 12 388 L 42 388"/>
    <!-- Bottom right -->
    <path d="M 358 388 L 388 388 L 388 358"/>
  </g>

  <!-- Watch face circle -->
  <circle cx="200" cy="168" r="88" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="168" r="80" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.25"/>
  <circle cx="200" cy="168" r="72" fill="rgba(201,168,76,0.03)"/>

  <!-- Hour markers on watch face -->
  <g stroke="#C9A84C" stroke-linecap="round" filter="url(#subtleGlow)">
    <line x1="200" y1="85" x2="200" y2="96" stroke-width="2.5"/>
    <line x1="283" y1="168" x2="272" y2="168" stroke-width="2.5"/>
    <line x1="200" y1="251" x2="200" y2="240" stroke-width="2.5"/>
    <line x1="117" y1="168" x2="128" y2="168" stroke-width="2.5"/>
    <!-- Minor markers -->
    <line x1="241" y1="97" x2="236" y2="105" stroke-width="1.5" opacity="0.6"/>
    <line x1="275" y1="131" x2="267" y2="136" stroke-width="1.5" opacity="0.6"/>
    <line x1="275" y1="205" x2="267" y2="200" stroke-width="1.5" opacity="0.6"/>
    <line x1="241" y1="239" x2="236" y2="231" stroke-width="1.5" opacity="0.6"/>
    <line x1="159" y1="239" x2="164" y2="231" stroke-width="1.5" opacity="0.6"/>
    <line x1="125" y1="205" x2="133" y2="200" stroke-width="1.5" opacity="0.6"/>
    <line x1="125" y1="131" x2="133" y2="136" stroke-width="1.5" opacity="0.6"/>
    <line x1="159" y1="97" x2="164" y2="105" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Watch hands -->
  <line x1="200" y1="168" x2="200" y2="112" stroke="#E8E4D9" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="200" y1="168" x2="236" y2="150" stroke="#E8E4D9" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="168" x2="200" y2="100" stroke="#C9A84C" stroke-width="1" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>

  <!-- Centre dot -->
  <circle cx="200" cy="168" r="5" fill="#C9A84C" filter="url(#glow)"/>
  <circle cx="200" cy="168" r="2.5" fill="#050505"/>

  <!-- Gold separator lines -->
  <line x1="60" y1="272" x2="340" y2="272" stroke="url(#goldGrad2)" stroke-width="1"/>
  <line x1="60" y1="276" x2="340" y2="276" stroke="url(#goldGrad2)" stroke-width="0.5" opacity="0.5"/>

  <!-- STORIES TO WATCH text -->
  <text x="200" y="308"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="bold"
    letter-spacing="6"
    fill="url(#goldGrad)"
    filter="url(#subtleGlow)">STORIES TO</text>

  <text x="200" y="338"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="bold"
    letter-spacing="8"
    fill="url(#goldGrad)"
    filter="url(#glow)">WATCH</text>

  <!-- EST line -->
  <text x="200" y="362"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="8"
    letter-spacing="5"
    fill="#C9A84C"
    opacity="0.5">EST. MMXXVI</text>

  <!-- Top label -->
  <text x="200" y="56"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="7"
    letter-spacing="4"
    fill="#C9A84C"
    opacity="0.5">LUXURY HOROLOGY EDITORIAL</text>

</svg>
