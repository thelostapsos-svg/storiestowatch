<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" width="800" height="500">
  <defs>
    <linearGradient id="tankCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F5D76E"/>
      <stop offset="60%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="tankGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="tankGlow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <rect width="800" height="500" fill="#050505"/>
  
  <!-- Leather strap top -->
  <rect x="330" y="20" width="140" height="135" rx="8" fill="#1A0A04" stroke="#3A2010" stroke-width="1"/>
  <rect x="338" y="25" width="124" height="125" rx="6" fill="#220E06"/>
  <!-- Strap stitching -->
  <g stroke="#4A2010" stroke-width="1" stroke-dasharray="5,4" opacity="0.6">
    <line x1="345" y1="30" x2="345" y2="145"/>
    <line x1="455" y1="30" x2="455" y2="145"/>
  </g>
  
  <!-- Leather strap bottom -->
  <rect x="330" y="345" width="140" height="135" rx="8" fill="#1A0A04" stroke="#3A2010" stroke-width="1"/>
  <rect x="338" y="350" width="124" height="125" rx="6" fill="#220E06"/>
  <g stroke="#4A2010" stroke-width="1" stroke-dasharray="5,4" opacity="0.6">
    <line x1="345" y1="355" x2="345" y2="470"/>
    <line x1="455" y1="355" x2="455" y2="470"/>
  </g>
  
  <!-- Tank case - rectangular, elongated -->
  <rect x="270" y="130" width="260" height="240" rx="8" fill="url(#tankCase)" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Side bars - Tank signature -->
  <rect x="255" y="148" width="18" height="204" rx="4" fill="url(#tankCase)" stroke="#C9A84C" stroke-width="1"/>
  <rect x="527" y="148" width="18" height="204" rx="4" fill="url(#tankCase)" stroke="#C9A84C" stroke-width="1"/>
  
  <!-- Crown -->
  <rect x="538" y="238" width="16" height="24" rx="4" fill="#C9A84C" stroke="#8B6914" stroke-width="1"/>
  
  <!-- Dial - cream white -->
  <rect x="288" y="148" width="224" height="204" rx="4" fill="#F5F0E8"/>
  
  <!-- Roman numeral indices -->
  <g font-family="Georgia, serif" fill="#1A1A18" text-anchor="middle">
    <text x="400" y="175" font-size="14" font-weight="bold">XII</text>
    <text x="400" y="340" font-size="14" font-weight="bold">VI</text>
    <text x="305" y="255" font-size="12">IX</text>
    <text x="495" y="255" font-size="12">III</text>
    <text x="450" y="190" font-size="10">I</text>
    <text x="480" y="210" font-size="10">II</text>
    <text x="482" y="295" font-size="10">IV</text>
    <text x="453" y="318" font-size="10">V</text>
    <text x="348" y="318" font-size="10">VII</text>
    <text x="318" y="298" font-size="10">VIII</text>
    <text x="320" y="210" font-size="10">X</text>
    <text x="348" y="190" font-size="10">XI</text>
  </g>
  
  <!-- Railroad minute track -->
  <rect x="293" y="153" width="214" height="194" rx="3" fill="none" stroke="#8A8A80" stroke-width="1" opacity="0.4"/>
  
  <!-- Blue sword hands - Cartier signature -->
  <g filter="url(#tankGlow)">
    <polygon points="400,175 405,240 400,248 395,240" fill="#1A3A8A"/>
    <polygon points="400,165 403,248 400,256 397,248" fill="#1A3A8A" opacity="0.8"/>
    <line x1="400" y1="158" x2="400" y2="256" stroke="#2A4A9A" stroke-width="1"/>
  </g>
  <circle cx="400" cy="250" r="5" fill="#C9A84C"/>
  <circle cx="400" cy="250" r="2.5" fill="#F5F0E8"/>
  
  <!-- Cartier signature -->
  <text x="400" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1A1A18" letter-spacing="2">CARTIER</text>
  <text x="400" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#5A5A58" letter-spacing="2">PARIS</text>
  
  <!-- Sapphire crown on winding crown -->
  <circle cx="546" cy="242" r="4" fill="#1A3A8A"/>
  
  <line x1="100" y1="470" x2="700" y2="470" stroke="url(#tankGold)" stroke-width="0.5" opacity="0.4"/>
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8A8578" letter-spacing="4">TANK LOUIS CARTIER · 18CT GOLD</text>
</svg>