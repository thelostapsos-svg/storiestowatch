<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" width="800" height="500">
  <defs>
    <radialGradient id="subDial" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="subCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A48"/>
      <stop offset="45%" stop-color="#9A9A98"/>
      <stop offset="55%" stop-color="#7A7A78"/>
      <stop offset="100%" stop-color="#3A3A38"/>
    </linearGradient>
    <linearGradient id="subBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="100%" stop-color="#0A0A08"/>
    </linearGradient>
    <linearGradient id="subGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="subGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <rect width="800" height="500" fill="#050505"/>
  
  <!-- Oyster bracelet left -->
  <g fill="url(#subCase)" stroke="#2A2A28" stroke-width="0.5">
    <rect x="50" y="192" width="148" height="24" rx="2"/>
    <rect x="55" y="195" width="138" height="18" rx="1" fill="#7A7A78"/>
    <rect x="50" y="218" width="148" height="20" rx="2"/>
    <rect x="55" y="221" width="138" height="14" rx="1" fill="#7A7A78"/>
    <rect x="50" y="240" width="148" height="24" rx="2"/>
    <rect x="55" y="243" width="138" height="18" rx="1" fill="#7A7A78"/>
    <rect x="50" y="266" width="148" height="20" rx="2"/>
    <rect x="55" y="269" width="138" height="14" rx="1" fill="#7A7A78"/>
    <rect x="50" y="168" width="148" height="22" rx="2"/>
    <rect x="55" y="171" width="138" height="16" rx="1" fill="#7A7A78"/>
  </g>
  
  <!-- Oyster bracelet right -->
  <g fill="url(#subCase)" stroke="#2A2A28" stroke-width="0.5">
    <rect x="602" y="192" width="148" height="24" rx="2"/>
    <rect x="607" y="195" width="138" height="18" rx="1" fill="#7A7A78"/>
    <rect x="602" y="218" width="148" height="20" rx="2"/>
    <rect x="607" y="221" width="138" height="14" rx="1" fill="#7A7A78"/>
    <rect x="602" y="240" width="148" height="24" rx="2"/>
    <rect x="607" y="243" width="138" height="18" rx="1" fill="#7A7A78"/>
    <rect x="602" y="266" width="148" height="20" rx="2"/>
    <rect x="607" y="269" width="138" height="14" rx="1" fill="#7A7A78"/>
    <rect x="602" y="168" width="148" height="22" rx="2"/>
    <rect x="607" y="171" width="138" height="16" rx="1" fill="#7A7A78"/>
  </g>
  
  <!-- Case -->
  <circle cx="400" cy="250" r="195" fill="url(#subCase)" stroke="#8A8A88" stroke-width="1.5"/>
  
  <!-- Crown at 3 o'clock -->
  <rect x="592" y="240" width="18" height="20" rx="4" fill="#6A6A68" stroke="#4A4A48" stroke-width="1"/>
  
  <!-- Rotating bezel - black insert with pip at 12 -->
  <circle cx="400" cy="250" r="188" fill="url(#subBezel)" stroke="#3A3A38" stroke-width="1"/>
  <circle cx="400" cy="250" r="170" fill="url(#subCase)"/>
  
  <!-- Bezel minute markers -->
  <g fill="#C9A84C" font-family="Arial" font-size="10" text-anchor="middle" filter="url(#subGlow)">
    <!-- Pip at 12 -->
    <rect x="395" y="64" width="10" height="16" rx="2"/>
    <!-- 5 minute markers -->
    <text x="400" y="90" fill="#E8E4D9" font-size="9">5</text>
    <text x="487" y="113" fill="#E8E4D9" font-size="9">10</text>
    <text x="541" y="175" fill="#E8E4D9" font-size="9">15</text>
    <text x="565" y="255" fill="#E8E4D9" font-size="9">20</text>
    <text x="541" y="335" fill="#E8E4D9" font-size="9">25</text>
    <text x="490" y="397" fill="#E8E4D9" font-size="9">30</text>
  </g>
  
  <!-- Dial -->
  <circle cx="400" cy="250" r="155" fill="#050505"/>
  
  <!-- Hour markers - Mercedes hands style indices -->
  <g fill="#C9A84C" filter="url(#subGlow)">
    <rect x="393" y="103" width="14" height="24" rx="2"/>
    <rect x="393" y="373" width="14" height="24" rx="2"/>
    <rect x="527" y="243" width="24" height="14" rx="2"/>
    <rect x="249" y="243" width="24" height="14" rx="2"/>
    <rect x="460" y="120" width="14" height="20" rx="2" transform="rotate(30 467 130)"/>
    <rect x="330" y="120" width="14" height="20" rx="2" transform="rotate(-30 337 130)"/>
    <rect x="460" y="357" width="14" height="20" rx="2" transform="rotate(-30 467 367)"/>
    <rect x="330" y="357" width="14" height="20" rx="2" transform="rotate(30 337 367)"/>
    <rect x="530" y="165" width="14" height="20" rx="2" transform="rotate(60 537 175)"/>
    <rect x="246" y="165" width="14" height="20" rx="2" transform="rotate(-60 253 175)"/>
  </g>
  
  <!-- Submariner hands - Mercedes style -->
  <g filter="url(#subGlow)">
    <!-- Hour hand - wide with circle -->
    <rect x="393" y="175" width="14" height="80" rx="4" fill="#E8E4D9"/>
    <circle cx="400" cy="195" r="10" fill="none" stroke="#E8E4D9" stroke-width="4"/>
    <!-- Minute hand -->
    <rect x="397" y="125" width="6" height="130" rx="3" fill="#E8E4D9"/>
    <!-- Seconds -->
    <line x1="400" y1="105" x2="400" y2="270" stroke="#C9A84C" stroke-width="1.5"/>
    <circle cx="400" cy="285" r="5" fill="#C9A84C"/>
  </g>
  
  <!-- Centre -->
  <circle cx="400" cy="250" r="6" fill="#C9A84C"/>
  <circle cx="400" cy="250" r="3" fill="#050505"/>
  
  <!-- Rolex crown logo -->
  <text x="400" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9A84C" opacity="0.9">♛</text>
  <text x="400" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C9A84C" letter-spacing="2">ROLEX</text>
  <text x="400" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8A8578" letter-spacing="2">OYSTER PERPETUAL</text>
  <text x="400" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8A8578" letter-spacing="2">SUBMARINER</text>
  
  <line x1="100" y1="470" x2="700" y2="470" stroke="url(#subGold)" stroke-width="0.5" opacity="0.4"/>
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8A8578" letter-spacing="4">SUBMARINER · REF. 124060</text>
</svg>