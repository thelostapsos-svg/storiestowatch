<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" width="800" height="500">
  <defs>
    <linearGradient id="iwcCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A5A58"/>
      <stop offset="45%" stop-color="#9A9A98"/>
      <stop offset="55%" stop-color="#7A7A78"/>
      <stop offset="100%" stop-color="#3A3A38"/>
    </linearGradient>
    <linearGradient id="iwcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="iwcGlow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <rect width="800" height="500" fill="#050505"/>
  
  <!-- Leather strap top -->
  <rect x="335" y="15" width="130" height="140" rx="6" fill="#0A0806" stroke="#2A1A08" stroke-width="1"/>
  <rect x="342" y="20" width="116" height="130" rx="4" fill="#120C04"/>
  <g stroke="#2A1208" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
    <line x1="350" y1="25" x2="350" y2="148"/>
    <line x1="450" y1="25" x2="450" y2="148"/>
  </g>
  
  <!-- Leather strap bottom -->
  <rect x="335" y="345" width="130" height="140" rx="6" fill="#0A0806" stroke="#2A1A08" stroke-width="1"/>
  <rect x="342" y="350" width="116" height="130" rx="4" fill="#120C04"/>
  <g stroke="#2A1208" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
    <line x1="350" y1="355" x2="350" y2="478"/>
    <line x1="450" y1="355" x2="450" y2="478"/>
  </g>
  
  <!-- Large round case - Portugieser signature 42mm -->
  <circle cx="400" cy="250" r="200" fill="url(#iwcCase)" stroke="#8A8A88" stroke-width="2"/>
  
  <!-- Crown at 3 -->
  <rect x="596" y="240" width="16" height="20" rx="4" fill="#6A6A68" stroke="#4A4A48" stroke-width="1"/>
  
  <!-- Inner bezel ring -->
  <circle cx="400" cy="250" r="188" fill="#0A0808" stroke="#4A4A48" stroke-width="1"/>
  
  <!-- Minute track ring -->
  <circle cx="400" cy="250" r="175" fill="none" stroke="#6A6A68" stroke-width="0.5"/>
  
  <!-- Dial - silver -->
  <circle cx="400" cy="250" r="172" fill="#E8E4DC"/>
  
  <!-- Minute track dots -->
  <g fill="#3A3A38">
    <circle cx="400" cy="82" r="3"/>
    <circle cx="487" cy="101" r="2"/>
    <circle cx="557" cy="151" r="2"/>
    <circle cx="594" cy="238" r="3"/>
    <circle cx="557" cy="325" r="2"/>
    <circle cx="487" cy="375" r="2"/>
    <circle cx="400" cy="394" r="3"/>
    <circle cx="313" cy="375" r="2"/>
    <circle cx="243" cy="325" r="2"/>
    <circle cx="206" cy="238" r="3"/>
    <circle cx="243" cy="151" r="2"/>
    <circle cx="313" cy="101" r="2"/>
  </g>
  
  <!-- Arabic numerals - Portugieser signature -->
  <g font-family="Georgia, serif" fill="#1A1A18" text-anchor="middle" font-size="20" font-weight="bold">
    <text x="400" y="110">12</text>
    <text x="570" y="258">3</text>
    <text x="400" y="408">6</text>
    <text x="230" y="258">9</text>
  </g>
  <g font-family="Georgia, serif" fill="#1A1A18" text-anchor="middle" font-size="14">
    <text x="490" y="130">1</text>
    <text x="548" y="188">2</text>
    <text x="548" y="320">4</text>
    <text x="490" y="378">5</text>
    <text x="310" y="378">7</text>
    <text x="252" y="320">8</text>
    <text x="252" y="188">10</text>
    <text x="310" y="130">11</text>
  </g>
  
  <!-- Small seconds subdial at 6 -->
  <circle cx="400" cy="338" r="30" fill="none" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="400" y1="318" x2="400" y2="332" stroke="#1A1A18" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Dauphine hands - IWC signature -->
  <g filter="url(#iwcGlow)">
    <polygon points="400,120 406,245 400,252 394,245" fill="#1A1A18"/>
    <polygon points="400,105 403,250 400,256 397,250" fill="#1A1A18" opacity="0.7"/>
  </g>
  <circle cx="400" cy="250" r="5" fill="#3A3A38"/>
  <circle cx="400" cy="250" r="2" fill="#E8E4DC"/>
  
  <!-- IWC text -->
  <text x="400" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3A3A38" letter-spacing="3">IWC</text>
  <text x="400" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#6A6A68" letter-spacing="2">SCHAFFHAUSEN</text>
  
  <line x1="100" y1="470" x2="700" y2="470" stroke="url(#iwcGold)" stroke-width="0.5" opacity="0.4"/>
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8A8578" letter-spacing="4">PORTUGIESER · AUTOMATIC · IW500701</text>
</svg>